spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration - Render uses PostgreSQL
# For PostgreSQL on Render:
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/careerlytics}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Auto-detect database driver based on URL
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

# HikariCP Connection Pool Settings (optimized for Render free tier)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.keepalive-time=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.open-in-view=false

# JWT Secret (must be set in Render environment variables)
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=86400000

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
